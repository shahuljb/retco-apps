<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>try{var __t=localStorage.getItem('retco_oc_theme')||'light';if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t);}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RETCO Order Collection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F2E7; --surface:#FFFFFF; --surface-2:#ECE3D0; --border:#D8CBAE;
  --fg:#1F2A33; --muted:#6B6456; --accent:#2C4A6E; --accent-fg:#FFFFFF;
  --warn:#A3432F; --warn-bg:#F3DCD3; --good:#2F6B45; --good-bg:#DCEADF;
  --chip-bg:#E4ECF2; --wa:#25D366; --wa-fg:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181C; --surface:#1C2227; --surface-2:#232A30; --border:#333B42;
    --fg:#E8E6DF; --muted:#9AA3AA; --accent:#6FA8D8; --accent-fg:#0B1620;
    --warn:#E08769; --warn-bg:#3A2620; --good:#7FCB94; --good-bg:#1E3326;
    --chip-bg:#202C34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181C; --surface:#1C2227; --surface-2:#232A30; --border:#333B42;
  --fg:#E8E6DF; --muted:#9AA3AA; --accent:#6FA8D8; --accent-fg:#0B1620;
  --warn:#E08769; --warn-bg:#3A2620; --good:#7FCB94; --good-bg:#1E3326;
  --chip-bg:#202C34;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:"Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Lora","Public Sans",serif;font-weight:600;margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%}
input.num-input{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font-family:inherit;cursor:pointer}
.app-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.app-bar .tabs{display:flex;gap:6px;overflow-x:auto;flex-basis:100%;padding-bottom:2px}
.app-bar .tabs .tabbtn{flex-shrink:0}
.app-bar h1{font-size:17px;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.snapshot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 16px 0;max-width:720px;margin:0 auto;width:100%}
@media(min-width:480px){.snapshot{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.tile .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:17px;font-weight:600;margin-top:2px}
.tile .val.warn{color:var(--warn)}
.tile .val.good{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-stack{display:flex;flex-direction:column;gap:12px}
.section-label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.breakdown{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 13px}
.breakdown .brow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.breakdown .brow.total{font-size:16px;font-weight:700;color:var(--fg);border-top:1px solid var(--border);padding-top:6px;margin-top:2px}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.checkrow input[type=checkbox]{width:auto}
.btn-primary{background:var(--accent);color:var(--accent-fg);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;width:100%}
.btn-secondary{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
.codebox{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;line-height:1.4;resize:none;word-break:break-all}
.ghost-btn{background:none;border:1px dashed var(--border);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--accent);width:100%}
.item-block{border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2)}
.item-block-head{display:flex;gap:8px;align-items:center}
.item-block-head input{flex:1}
.icon-btn{background:none;border:none;color:var(--muted);font-size:18px;padding:2px 6px;line-height:1;flex-shrink:0}
.item-total-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:2px;border-top:1px solid var(--border)}
.item-total-line b{color:var(--fg);font-weight:700;font-family:"IBM Plex Mono",monospace}
.searchbar{position:relative}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.toolbar button, .toolbar label{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.toolbar button:hover, .toolbar label:hover{color:var(--fg);border-color:var(--accent)}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filter-chips button{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filter-chips button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day-group{display:flex;flex-direction:column;gap:8px}
.day-head{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:4px 2px 0}
.sale-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.sale-row-top{display:flex;align-items:flex-start;gap:10px}
.sale-row-main{flex:1;min-width:0}
.sale-row-main .shop{font-size:14px;font-weight:700}
.sale-row-main .prod{font-size:12.5px;color:var(--muted);margin-top:1px}
.sale-row-amt{text-align:right;flex-shrink:0}
.sale-row-amt .amt{font-size:14.5px;font-weight:700}
.sale-row-amt .amt .strike{font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:500;margin-right:4px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:10px;margin-top:3px;margin-left:4px;text-transform:uppercase;letter-spacing:.02em}
.badge:first-of-type{margin-left:0}
.badge.cash{background:var(--good-bg);color:var(--good)}
.badge.credit{background:var(--warn-bg);color:var(--warn)}
.badge.partial{background:#F8ECD5;color:#925E12}
.badge.paid{background:var(--good-bg);color:var(--good)}
.badge.returned{background:var(--chip-bg);color:var(--muted)}
.sale-detail{border-top:1px solid var(--border);padding-top:9px;display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--muted)}
.sale-detail .drow{display:flex;justify-content:space-between;gap:10px}
.sale-detail .drow b{color:var(--fg);font-weight:600}
.detail-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.detail-actions button{flex:1;min-width:80px}
.btn-warn{background:var(--warn);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
.btn-good{background:var(--good);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
.btn-neutral{background:var(--chip-bg);color:var(--accent);border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
.btn-wa{background:var(--wa);color:var(--wa-fg);border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.bill-item{border-top:1px solid var(--border);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.bill-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bill-item-name{font-size:13px;font-weight:700;color:var(--fg)}
.bill-item-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.bill-item-amt{font-size:13px;font-weight:700;text-align:right;color:var(--fg);flex-shrink:0}
.bill-item-amt .strike{font-size:10.5px;color:var(--muted);text-decoration:line-through;font-weight:500;margin-right:4px}
.bill-item-actions{display:flex;gap:7px}
.bill-item-actions button{flex:1;padding:6px 9px;font-size:11px;border-radius:8px}
.action-box{display:flex;flex-direction:column;gap:8px;margin-top:4px;background:var(--chip-bg);border-radius:10px;padding:10px}
.action-box .rrow{display:flex;gap:8px;align-items:center}
.action-box input, .action-box select{flex:1}
.action-box .rpreview{font-size:11.5px;color:var(--muted);text-align:right}
.sub-history{display:flex;flex-direction:column;gap:5px;margin-top:4px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.sub-history .hline{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;border-top:1px dashed var(--border)}
.sub-history .hline:first-of-type{border-top:none}
.sub-history .hline b{color:var(--fg)}
.shop-group{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.shop-group-head{display:flex;justify-content:space-between;align-items:baseline}
.shop-group-head .name{font-size:14.5px;font-weight:700}
.shop-group-head .due{font-size:15px;font-weight:700;color:var(--warn)}
.bill-line-wrap{display:flex;flex-direction:column;border-top:1px solid var(--border);padding:8px 0;gap:6px}
.bill-line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bill-line .binfo{font-size:12.5px;color:var(--muted);min-width:0}
.bill-line .binfo b{color:var(--fg)}
.bill-line .bamt{font-size:13px;font-weight:600;white-space:nowrap}
.bill-line-actions{display:flex;gap:6px;align-items:center}
.bill-line-actions button{flex-shrink:0;border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted);font-size:13.5px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:9px 18px;border-radius:20px;font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:99}
.toast.show{opacity:1}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.sale-row.dim{opacity:.65}
.badge.today{background:#F8ECD5;color:#925E12}
.badge.late{background:var(--warn-bg);color:var(--warn)}
.prep-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg);padding:3px 0}
.prep-line b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600}
.linkbanner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--chip-bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--fg)}
.linkbanner button{flex-shrink:0}
.t-warn{color:var(--warn)!important}.t-good{color:var(--good)!important}
textarea{resize:vertical}
.modal-back{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:14px;padding:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.modal-actions{display:flex;flex-direction:column;gap:8px}
@media print{body>*:not(#invoiceView){display:none!important}#invoiceView{position:static!important;overflow:visible!important}#invoiceView .no-print{display:none!important}}
[hidden]{display:none!important}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.row-actions>*{flex:1;min-width:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid var(--border);object-fit:cover;cursor:pointer;background:var(--surface-2)}
.photo-view{position:fixed;left:0;top:0;right:0;bottom:0;z-index:400;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.photo-view img{max-width:100%;max-height:78vh;border-radius:8px}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.badge.due{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.upi{background:var(--chip-bg);color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.kv b{font-weight:600}
.msg{font-size:12.5px;line-height:1.5;color:var(--fg);background:var(--chip-bg);border-radius:10px;padding:9px 11px}
.msg.err{background:var(--warn-bg);color:var(--warn)}
details.card>summary{cursor:pointer;font-weight:700;font-size:13.5px}
.mini{font-size:11.5px;color:var(--muted)}
input[type=file]{padding:8px;font-size:13px}
textarea.big{min-height:120px;font-size:16px;line-height:1.4}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chipset button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chipset.pos button[aria-selected="true"]{background:var(--good);border-color:var(--good);color:#fff}
.chipset.neg button[aria-selected="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-fg);border:none;border-radius:28px;padding:14px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.badge.pri-Critical{background:var(--warn);color:#fff}.badge.pri-High{background:var(--warn-bg);color:var(--warn)}.badge.pri-Medium{background:#F8ECD5;color:#925E12}.badge.pri-Low{background:var(--chip-bg);color:var(--muted)}
.said{font-size:13px;line-height:1.45;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.said.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl{border-left:3px solid var(--border);padding-left:11px;margin-left:4px;display:flex;flex-direction:column;gap:10px}
.tl .ev{position:relative}.tl .ev:before{content:"";position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl .ev.neg:before{background:var(--warn)}.tl .ev.pos:before{background:var(--good)}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .rr{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rank .rr .nm{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rr .bar{flex:1}.rank .rr b{flex:0 0 28px;text-align:right}
.hist{font-size:11px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.sec-h{font-size:14px;font-weight:700}
.tabs .tabbtn.hot:after{content:attr(data-n);margin-left:6px;background:var(--warn);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav button{background:none;border:none;padding:9px 2px 8px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.bottomnav button[aria-selected="true"]{color:var(--accent)}
.bottomnav button i{font-style:normal;font-size:18px;line-height:1}
.wrap{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;max-width:720px;margin:0 auto}
.subtabs button{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tile.click,.sale-row.click{cursor:pointer}.tile.click:active,.sale-row.click:active{opacity:.75}
.tile .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:14px 16px;cursor:pointer}
.hero .lbl{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}.hero .val{font-size:28px;font-weight:700;margin-top:2px}
.hero .row{display:flex;gap:14px;margin-top:8px;font-size:12px;opacity:.95;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:10px}.crumb h3{flex:1;font-size:17px}
.badge.bad{background:var(--warn);color:#fff}.badge.warnb{background:#F8ECD5;color:#925E12}
.agebar{display:flex;height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}.agebar i{display:block;height:100%}
.pos{color:var(--good)}.neg{color:var(--warn)}
.stmt .brow{font-size:13px}.stmt .brow.sub{padding-left:12px}.stmt .brow.head{font-weight:700;color:var(--fg);margin-top:6px}
.demo-banner{background:#F8ECD5;color:#925E12;font-size:12px;font-weight:700;text-align:center;padding:5px 10px}
.chk{display:flex;align-items:center;gap:8px}.chk input{width:auto}
.sale-row .said{margin-top:3px}
.insbox{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.sug{display:flex;flex-direction:column;gap:6px}.sug button{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--fg)}
.sug button b{font-weight:700}.sug button span{color:var(--muted);font-size:12px}
.shopcard{background:var(--chip-bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px}
textarea.notes{min-height:84px;font-size:16px;line-height:1.45}

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
function T(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
function add(p){ for (let i = 1; i < arguments.length; i++){ const c = arguments[i]; if (c) p.appendChild(c); } return p; }
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const MONEY = n => { n = round2(num(n)); const neg = n < 0; n = Math.abs(n); return (neg ? '-Rs. ' : 'Rs. ') + n.toLocaleString('en-IN', {maximumFractionDigits: n % 1 === 0 ? 0 : 2}); };
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = ds => { if (!ds) return ''; const p = ds.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const monthKey = ds => (ds || '').slice(0, 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel = k => { const p = (k || '').split('-'); return p.length > 1 ? MONTHS[+p[1] - 1] + ' ' + p[0] : ''; };
const addMonths = (k, n) => { const p = k.split('-'); const d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monthEnd = k => { const p = k.split('-'); return k + '-' + pad(new Date(+p[0], +p[1], 0).getDate()); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
let toastTimer = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

/* ================= form helpers ================= */
function labeled(label, node){ const f = T('div', 'field'); add(f, T('label', null, label), node); return f; }
function numInput(value, oninput, ph){
  const i = T('input', 'num-input'); i.type = 'text'; i.inputMode = 'decimal'; i.value = (value === 0 || value) ? String(value) : ''; if (ph) i.placeholder = ph;
  i.addEventListener('input', () => { const v = i.value.replace(/[^0-9.]/g, ''); if (v !== i.value) i.value = v; oninput(v === '' ? null : parseFloat(v)); });
  return i;
}
function textInput(type, value, oninput, o){
  o = o || {}; const i = T('input'); i.type = type || 'text'; i.value = value || ''; if (o.ph) i.placeholder = o.ph; if (o.list) i.setAttribute('list', o.list); if (o.id) i.id = o.id;
  i.addEventListener('input', () => oninput(i.value)); if (o.onchange) i.addEventListener('change', () => o.onchange(i.value));
  return i;
}
function selectInput(opts, value, onchange){
  const s = T('select'); opts.forEach(o => { const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; const op = T('option', null, l); op.value = v; if (v === value) op.selected = true; s.appendChild(op); });
  s.addEventListener('change', () => onchange(s.value)); return s;
}
function seg(opts, value, onchange){
  const d = T('div', 'seg');
  opts.forEach(o => { const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; const b = T('button', null, l); b.setAttribute('data-v', v); b.type = 'button'; b.setAttribute('aria-selected', String(v === value)); b.addEventListener('click', () => onchange(v)); d.appendChild(b); });
  return d;
}
function chips(opts, value, onchange, id){
  const d = T('div', 'filter-chips'); if (id) d.id = id;
  opts.forEach(o => { const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; const b = T('button', null, l); b.setAttribute('data-v', v); b.setAttribute('aria-selected', String(v === value)); b.addEventListener('click', () => onchange(v)); d.appendChild(b); });
  return d;
}
function brow(l, v, cls){ const r = T('div', 'brow' + (cls ? ' ' + cls : '')); add(r, T('span', null, l), T('span', 'num', v)); return r; }
function kv(l, v, cls){ const r = T('div', 'kv'); add(r, T('span', 'mini', l), T('b', 'num' + (cls ? ' ' + cls : ''), v)); return r; }
function tile(l, v, cls){ const t = T('div', 'tile'); add(t, T('div', 'lbl', l), T('div', 'val num' + (cls ? ' ' + cls : ''), v)); return t; }
function armedDelete(label, onDelete){
  const b = T('button', 'btn-warn', label || 'Delete'); let armed = false, tm = null;
  b.addEventListener('click', e => { e.stopPropagation(); if (!armed){ armed = true; b.textContent = 'Tap again to delete'; tm = setTimeout(() => { armed = false; b.textContent = label || 'Delete'; }, 3500); } else { clearTimeout(tm); onDelete(); } });
  return b;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function csvText(rows){ return rows.map(r => r.map(v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function downloadCSV(rows, name){ downloadBlob(new Blob(['﻿' + csvText(rows)], {type: 'text/csv;charset=utf-8;'}), name); toast('CSV saved'); }



/* =====================================================================
   RETCO ORDER COLLECTION
   UI (oc3..oc5)  ->  services (this file)  ->  data access layer (DAL)  ->  local storage now,
   Supabase later. Logical tables: shops, products, records (order_collection_records),
   insights (product_insights), followUps (follow_ups), settings (app_settings).
   Every row has a stable uuid id, createdAt and updatedAt.
   ===================================================================== */
const KEY = 'retco_oc_v1', VERSION = 1;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const nowIso = () => new Date().toISOString();
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const validDate = ds => /^\d{4}-\d{2}-\d{2}$/.test(ds || '') && !isNaN(new Date(ds + 'T12:00:00')) && new Date(ds + 'T12:00:00').getDate() === +ds.slice(8, 10);
const inRange = (d, a, b) => (!a || d >= a) && (!b || d <= b);
const genStamp = () => fmtDate(today()) + ' ' + nowTime();
const TABLES = ['shops', 'products', 'records', 'insights', 'followUps'];

/* ================= data access layer ================= */
const DAL = {
  mode: 'local',   /* 'local' now. A 'supabase' adapter can replace load/save later; no secret keys are ever kept in this file. */
  load(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } },
  save(db){ try { localStorage.setItem(KEY, JSON.stringify(db)); return true; } catch(e){ return false; } }
};
function blankDB(){
  return {meta: {version: VERSION, createdAt: nowIso()}, settings: {companyName: 'RETCO FOODS', address: 'SF No. 20/25, Chittara Nagar, Mathur, Pudukkottai-622515', phone: '+916379742810', user: 'RETCO', role: 'Owner', theme: 'light'},
    shops: [], products: [], records: [], insights: [], followUps: []};
}
let D = blankDB();
const stampNew = r => { r.id = r.id || uuid(); r.createdAt = r.createdAt || nowIso(); r.updatedAt = nowIso(); return r; };
function loadDB(){
  const o = DAL.load(), b = blankDB();
  if (o && typeof o === 'object'){ Object.keys(b).forEach(k => { if (o[k] !== undefined) b[k] = o[k]; }); b.settings = Object.assign(blankDB().settings, o.settings || {}); b.meta = Object.assign(b.meta, o.meta || {}); D = b; }
  else { D = b; seedProducts(); save(); }
}
function seedProducts(){
  [['Whole Wheat Chapati', 'Fresh Foods', 'packet'], ['Idli Dosa Batter', 'Fresh Foods', 'packet']].forEach(p => D.products.push(stampNew({code: nextCode('PRD', D.products), name: p[0], category: p[1], unit: p[2], active: true})));
}
function save(){ if (!DAL.save(D)) toast('Could not save: phone storage is full. Make a backup first.'); }

/* ================= lookups ================= */
const shopById = id => D.shops.find(s => s.id === id) || null;
const productById = id => D.products.find(p => p.id === id) || null;
const recordById = id => D.records.find(r => r.id === id) || null;
function nextCode(prefix, list){ let m = 0; list.forEach(x => { const n = parseInt(String(x.code || '').replace(/\D/g, ''), 10); if (n > m) m = n; }); return prefix + String(m + 1).padStart(3, '0'); }
const liveRecords = () => D.records.filter(r => r.status !== 'deleted');
const byNewest = (a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')) || (b.createdAt || '').localeCompare(a.createdAt || '');
const byOldest = (a, b) => byNewest(b, a);
const insightsOf = rid => D.insights.filter(i => i.recordId === rid && i.status !== 'deleted');
const shopName = r => { const s = shopById(r.shopUid); return s ? s.name : r.shopName; };
const shopCode = r => { const s = shopById(r.shopUid); return s ? s.code : r.shopCode; };
const shopArea = r => { const s = shopById(r.shopUid); return s ? s.area : r.area; };
const RESULTS = ['Order Given', 'Stock Available', 'Order Later', 'No Requirement Today', 'Slow Movement', 'Shop Closed', 'Owner Not Available', 'Not Interested', 'Other'];
const RES_CLASS = {'Order Given': 'ok', 'Stock Available': 'upi', 'Order Later': 'warnb', 'No Requirement Today': 'returned', 'Slow Movement': 'due', 'Shop Closed': 'returned', 'Owner Not Available': 'warnb', 'Not Interested': 'due', 'Other': 'returned'};
/* what each result needs: items = product lines (qty = order quantity, stock = stock quantity), follow = 'req' | 'opt' | '' */
const SPEC = {'Order Given': {items: 'qty', delivery: true, follow: 'opt'}, 'Stock Available': {items: 'stock', follow: 'opt'}, 'Order Later': {follow: 'req'}, 'No Requirement Today': {follow: 'opt'}, 'Slow Movement': {items: 'opt', follow: 'opt'}, 'Shop Closed': {follow: 'opt'}, 'Owner Not Available': {follow: 'req'}, 'Not Interested': {}, 'Other': {follow: 'opt'}};
function itemsText(r){
  return (r.items || []).map(i => i.productName + (num(i.qty) > 0 ? ' ' + num(i.qty) + (i.unit ? ' ' + i.unit : '') : '') + (i.stockQty !== null && i.stockQty !== undefined ? ' (stock ' + num(i.stockQty) + ')' : '')).join(', ');
}
const qtyText = r => (r.items || []).filter(i => num(i.qty) > 0).map(i => num(i.qty) + ' ' + (i.unit || '')).join(', ') || ((r.items || []).filter(i => i.stockQty !== null && i.stockQty !== undefined && i.stockQty !== '').map(i => 'stock ' + num(i.stockQty)).join(', '));

/* ================= shops ================= */
function validateShop(f){
  if (!String(f.name || '').trim()) return 'Enter the shop name'; const code = String(f.code || '').trim(); if (!code) return 'Shop ID is missing';
  if (D.shops.some(s => s.id !== f.id && norm(s.code) === norm(code))) return 'This Shop ID is already used';
  if (D.shops.some(s => s.id !== f.id && norm(s.name) === norm(f.name) && norm(s.area) === norm(f.area))) return 'A shop with this name and area already exists';
  return '';
}
function saveShop(f){
  const err = validateShop(f); if (err) throw new Error(err);
  const vals = {code: f.code.trim(), name: f.name.trim(), address: (f.address || '').trim(), area: (f.area || '').trim(), phone: (f.phone || '').trim(), gst: (f.gst || '').trim().toUpperCase(), notes: (f.notes || '').trim(), active: f.active !== false};
  if (f.id){ const s = shopById(f.id); Object.assign(s, vals, {updatedAt: nowIso()}); return s; }
  const s = stampNew(vals); D.shops.push(s); return s;
}
const shopUsed = s => D.records.some(r => r.shopUid === s.id) || D.followUps.some(f => f.shopUid === s.id);
function deleteShop(s){ if (shopUsed(s)) return false; D.shops.splice(D.shops.indexOf(s), 1); return true; }

/* ================= products ================= */
function validateProduct(f){
  if (!String(f.name || '').trim()) return 'Enter the product name'; const code = String(f.code || '').trim(); if (!code) return 'Product ID is missing';
  if (D.products.some(p => p.id !== f.id && norm(p.code) === norm(code))) return 'This Product ID is already used';
  if (D.products.some(p => p.id !== f.id && norm(p.name) === norm(f.name))) return 'This product already exists';
  return '';
}
function saveProduct(f){
  const err = validateProduct(f); if (err) throw new Error(err);
  const vals = {code: f.code.trim(), name: f.name.trim(), category: (f.category || '').trim(), unit: (f.unit || 'packet').trim(), active: f.active !== false};
  if (f.id){ const p = productById(f.id), oldName = p.name; Object.assign(p, vals, {updatedAt: nowIso()}); return p; }
  const p = stampNew(vals); D.products.push(p); return p;
}
const productUsed = p => D.records.some(r => (r.items || []).some(i => i.productUid === p.id)) || D.insights.some(i => i.productUid === p.id);
function deleteProduct(p){ if (productUsed(p)) return false; D.products.splice(D.products.indexOf(p), 1); return true; }
const activeProducts = (keepUid) => D.products.filter(p => p.active !== false || p.id === keepUid).sort((a, b) => a.name.localeCompare(b.name));
const activeShops = (keepUid) => D.shops.filter(s => s.active !== false || s.id === keepUid);

/* ================= records, insights, follow-ups ================= */
function itemSnap(i){ const p = productById(i.productUid); return {productUid: i.productUid, productId: p ? p.code : (i.productId || ''), productName: p ? p.name : (i.productName || ''), unit: p ? p.unit : (i.unit || ''), qty: i.qty === null || i.qty === undefined || i.qty === '' ? null : num(i.qty), stockQty: i.stockQty === null || i.stockQty === undefined || i.stockQty === '' ? null : num(i.stockQty)}; }
function validateRecord(F){
  const shop = shopById(F.shopUid); if (!shop) return 'Choose the shop first';
  if (!validDate(F.date)) return 'Invalid date'; if (!/^\d{2}:\d{2}$/.test(F.time || '')) return 'Invalid time';
  if (!F.result) return 'Choose the result of the call';
  const sp = SPEC[F.result], items = (F.items || []).filter(i => i.productUid || num(i.qty) > 0 || (i.stockQty !== null && i.stockQty !== undefined && i.stockQty !== ''));
  if (sp.items === 'qty'){ if (!items.length) return 'Choose the product ordered'; for (const i of items){ if (!i.productUid) return 'Choose the product'; if (!(num(i.qty) > 0)) return 'Enter the quantity ordered'; } }
  if (sp.items === 'stock'){ if (!items.length) return 'Choose the product'; for (const i of items) if (!i.productUid) return 'Choose the product'; }
  if (sp.items === 'opt') for (const i of items) if (!i.productUid) return 'Choose the product';
  if (sp.follow === 'req' && !F.followUpDate) return F.result === 'Order Later' ? 'Enter the expected order / follow-up date' : 'Enter the follow-up date';
  if (F.followUpDate && !validDate(F.followUpDate)) return 'Invalid follow-up date'; if (F.expectedDelivery && !validDate(F.expectedDelivery)) return 'Invalid delivery date';
  if (F.followUpDate && F.followUpDate < F.date) return 'Follow-up date cannot be before the call date';
  for (const n of F.insights || []){ const txt = String(n.note || '').trim(); if (!txt && !n.productUid) continue; if (!n.productUid) return 'Choose the product for the Product Insight'; if (!txt) return 'Write what the shop said about the product, or remove that Product Insight'; }
  return '';
}
function syncFollowUp(rec){
  const ex = D.followUps.find(f => f.recordId === rec.id);
  if (rec.followUpDate){
    if (ex){ if (ex.dueDate !== rec.followUpDate){ ex.dueDate = rec.followUpDate; if (ex.status !== 'open') { ex.status = 'open'; ex.doneAt = ''; ex.doneBy = ''; } } ex.reason = rec.result; ex.shopUid = rec.shopUid; ex.shopCode = rec.shopCode; ex.shopName = rec.shopName; ex.updatedAt = nowIso(); }
    else D.followUps.push(stampNew({recordId: rec.id, shopUid: rec.shopUid, shopCode: rec.shopCode, shopName: rec.shopName, dueDate: rec.followUpDate, reason: rec.result, status: 'open', doneAt: '', doneBy: ''}));
  } else if (ex && ex.status === 'open'){ ex.status = 'cancelled'; ex.updatedAt = nowIso(); }
}
function settlePrior(rec){ /* a new call to the shop closes follow-ups that were waiting for it */
  D.followUps.forEach(f => { if (f.shopUid !== rec.shopUid || f.status !== 'open' || f.recordId === rec.id) return;
    if (f.dueDate <= rec.date){ f.status = 'done'; f.doneAt = nowIso(); f.doneBy = rec.id; f.updatedAt = nowIso(); }
    else if (rec.followUpDate){ f.status = 'cancelled'; f.doneBy = rec.id; f.updatedAt = nowIso(); } });
}
function saveRecord(F){
  const err = validateRecord(F); if (err) throw new Error(err);
  const shop = shopById(F.shopUid), sp = SPEC[F.result];
  const items = sp.items ? (F.items || []).filter(i => i.productUid).map(itemSnap).map(i => { if (sp.items !== 'qty') i.qty = null; if (sp.items === 'qty') i.stockQty = null; return i; }) : [];
  const vals = {date: F.date, time: F.time, shopUid: shop.id, shopCode: shop.code, shopName: shop.name, area: shop.area, phone: shop.phone, result: F.result, items, expectedDelivery: sp.delivery ? (F.expectedDelivery || '') : '', followUpDate: sp.follow ? (F.followUpDate || '') : '', generalNotes: F.generalNotes || ''};
  let rec, isNew = !F.id;
  if (!isNew){
    rec = recordById(F.id); const ed = rec.edits = rec.edits || [];
    ['date', 'time', 'result', 'followUpDate', 'expectedDelivery', 'generalNotes'].forEach(k => { if ((rec[k] || '') !== (vals[k] || '')) ed.push({at: nowIso(), field: k, from: rec[k] || '', to: vals[k] || ''}); });
    if (JSON.stringify(rec.items || []) !== JSON.stringify(vals.items)) ed.push({at: nowIso(), field: 'items', from: itemsText(rec), to: itemsText(vals)});
    Object.assign(rec, vals, {updatedAt: nowIso()});
  } else {
    const dup = D.records.find(r => r.status !== 'deleted' && r.shopUid === vals.shopUid && r.date === vals.date && r.time === vals.time && r.result === vals.result && (r.generalNotes || '') === vals.generalNotes && Date.now() - Date.parse(r.createdAt) < 120000);
    if (dup) throw new Error('This call was just saved already');
    rec = stampNew(Object.assign({status: 'active', createdBy: D.settings.user}, vals)); D.records.push(rec);
  }
  /* product insights are kept in their own table, apart from the general notes */
  const keep = [];
  (F.insights || []).forEach(n => {
    const txt = String(n.note || ''); if (!txt.trim() || !n.productUid) return; const p = productById(n.productUid), common = {recordId: rec.id, shopUid: shop.id, shopCode: shop.code, shopName: shop.name, productUid: p.id, productId: p.code, productName: p.name, note: txt};
    let ins = n.id ? D.insights.find(x => x.id === n.id) : null;
    if (ins){ const ed = ins.edits = ins.edits || []; if (ins.note !== txt) ed.push({at: nowIso(), field: 'note', from: ins.note, to: txt}); if (ins.productUid !== p.id) ed.push({at: nowIso(), field: 'product', from: ins.productName, to: p.name}); Object.assign(ins, common, {status: 'active', updatedAt: nowIso()}); }
    else { ins = stampNew(Object.assign({status: 'active', date: rec.date, time: rec.time, area: shop.area}, common)); D.insights.push(ins); }
    keep.push(ins.id);
  });
  D.insights.forEach(i => { if (i.recordId === rec.id && i.status !== 'deleted' && keep.indexOf(i.id) < 0){ i.status = 'deleted'; i.updatedAt = nowIso(); } });
  syncFollowUp(rec); if (isNew) settlePrior(rec);
  save(); return rec;
}
function deleteRecord(r){ r.status = 'deleted'; r.deletedAt = nowIso(); r.updatedAt = nowIso(); D.insights.forEach(i => { if (i.recordId === r.id && i.status !== 'deleted'){ i.status = 'deleted'; i.deletedWith = 'record'; i.updatedAt = nowIso(); } }); D.followUps.forEach(f => { if (f.recordId === r.id && f.status === 'open'){ f.status = 'cancelled'; f.updatedAt = nowIso(); } }); save(); }
function restoreRecord(r){ r.status = 'active'; r.deletedAt = ''; r.updatedAt = nowIso(); D.insights.forEach(i => { if (i.recordId === r.id && i.deletedWith === 'record'){ i.status = 'active'; i.deletedWith = ''; i.updatedAt = nowIso(); } }); syncFollowUp(r); save(); }
const fuState = f => f.dueDate < today() ? 'overdue' : f.dueDate === today() ? 'today' : 'upcoming';
const openFollowUps = () => D.followUps.filter(f => f.status === 'open').filter(f => { const r = recordById(f.recordId); return r && r.status !== 'deleted'; });
function recFuStatus(r){ const f = D.followUps.find(x => x.recordId === r.id); if (!r.followUpDate) return 'none'; if (!f || f.status === 'cancelled') return 'cancelled'; if (f.status === 'done') return 'done'; return fuState(f); }
function markFollowUpDone(f){ f.status = 'done'; f.doneAt = nowIso(); f.doneBy = 'manual'; f.updatedAt = nowIso(); save(); }

/* ================= search & filters ================= */
const BLANK_F = {q: '', period: 'all', from: '', to: '', shop: '', product: '', result: '', area: '', fu: '', hasInsight: ''};

  if (key === 'yesterday'){ const y = addDays(t, -1); return [y, y]; }
  if (key === 'week'){ const dow = (d.getDay() + 6) % 7, s = addDays(t, -dow); return [s, addDays(s, 6)]; }
  if (key === 'month') return [mk + '-01', monthEnd(mk)];

  return ['', ''];
}

/* PDF drawn on canvas pages so Tamil (and any language) prints with the phone's own fonts */
function reportPdf(m){
  const W = 794, H = 1123, S = 2, M = 34, FONT = 'Arial, "Noto Sans Tamil", "Nirmala UI", "Latha", sans-serif', pages = []; let cv, cx, y;
  const seg2 = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, {granularity: 'grapheme'}) : null;
  const gl = s => seg2 ? Array.from(seg2.segment(s), x => x.segment) : Array.from(s);
  function newPage(){ cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S; cx = cv.getContext('2d'); cx.scale(S, S); cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.textBaseline = 'top'; pages.push(cv); y = M; }
  const font = (sz, b) => { cx.font = (b ? 'bold ' : '') + sz + 'px ' + FONT; };
  function wrap(t, wd, sz, b){
    font(sz, b); const out = [];
    String(t === undefined || t === null ? '' : t).split('\n').forEach(par => { let line = ''; par.split(' ').forEach(word => { const test = line ? line + ' ' + word : word; if (cx.measureText(test).width <= wd){ line = test; return; } if (line){ out.push(line); line = ''; } if (cx.measureText(word).width <= wd){ line = word; return; } gl(word).forEach(ch => { if (cx.measureText(line + ch).width > wd && line){ out.push(line); line = ch; } else line += ch; }); }); out.push(line); });
    return out;
  }
  const text = (t, x, yy, sz, b, color, al) => { font(sz, b); cx.fillStyle = color || '#111'; cx.textAlign = al || 'left'; cx.fillText(t, x, yy); cx.textAlign = 'left'; };
  const LH = 15, company = D.settings;
  function header(first){
    if (first){
      text(company.companyName || '', M, y, 18, true); const addr = wrap((company.address || '') + (company.phone ? ' | ' + company.phone : ''), 360, 10.5); addr.forEach((l, i) => text(l, M, y + 24 + i * 13, 10.5, false, '#444'));
      text(m.title, W - M, y, 16, true, '#111', 'right'); wrap(m.subtitle, 330, 10.5).forEach((l, i) => text(l, W - M, y + 22 + i * 13, 10.5, false, '#444', 'right'));
      y += Math.max(24 + addr.length * 13, 22 + wrap(m.subtitle, 330, 10.5).length * 13) + 6; cx.fillStyle = '#222'; cx.fillRect(M, y, W - 2 * M, 1.5); y += 12;
      if (m.summary.length){ let lines = [], cur = '', xx = 0; const items = m.summary.map(p => p[0] + ': ' + p[1]); font(11, true); items.forEach(it => { const wd = cx.measureText(it).width + 22; if (xx + wd > W - 2 * M - 16 && lines.length + 1 >= 0 && cur){ lines.push(cur); cur = ''; xx = 0; } cur += (cur ? '   |   ' : '') + it; xx += wd; }); if (cur) lines.push(cur);
        const bh = lines.length * 16 + 12; cx.fillStyle = '#f5f0e4'; cx.fillRect(M, y, W - 2 * M, bh); cx.strokeStyle = '#ddd'; cx.strokeRect(M, y, W - 2 * M, bh); lines.forEach((l, i) => text(l, M + 8, y + 7 + i * 16, 11, true)); y += bh + 12; }
    } else { text(m.title + ' (continued)', M, y, 11, true, '#555'); y += 20; }
  }
  newPage(); header(true);
  m.sections.forEach(sec => {
    const tw = W - 2 * M, tot = sec.cols.reduce((a, c) => a + c.w, 0), cw = sec.cols.map(c => c.w / tot * tw);
    const need = 34 + 30; if (y + need > H - 40){ newPage(); header(false); }
    text(sec.heading, M, y, 12.5, true); y += 20;
    const drawHead = () => { cx.fillStyle = '#ece3d0'; cx.fillRect(M, y, tw, 20); let xx = M; sec.cols.forEach((c, i) => { text(c.h, c.a === 'r' ? xx + cw[i] - 5 : xx + 5, y + 4, 10.5, true, '#111', c.a === 'r' ? 'right' : 'left'); xx += cw[i]; }); y += 20; };
    drawHead(); if (!sec.rows.length && sec.note){ text(sec.note, M + 5, y + 5, 10.5, false, '#666'); y += 24; }
    sec.rows.forEach(row => {
      const cells = row.map((v, i) => wrap(v, cw[i] - 10, 10.5)), lines = Math.max(1, ...cells.map(c => c.length)), rh = lines * 13.5 + 8;
      if (y + rh > H - 40){ newPage(); header(false); drawHead(); }
      let xx = M; cells.forEach((cl, i) => { cl.forEach((l, k) => text(l, sec.cols[i].a === 'r' ? xx + cw[i] - 5 : xx + 5, y + 4 + k * 13.5, 10.5, false, '#111', sec.cols[i].a === 'r' ? 'right' : 'left')); xx += cw[i]; });
      cx.fillStyle = '#ddd'; cx.fillRect(M, y + rh - 1, tw, 0.8); y += rh;
    });
    if (sec.foot){ cx.fillStyle = '#f5f0e4'; cx.fillRect(M, y, tw, 20); let xx = M; sec.foot.forEach((v, i) => { text(String(v), sec.cols[i].a === 'r' ? xx + cw[i] - 5 : xx + 5, y + 4, 10.5, true, '#111', sec.cols[i].a === 'r' ? 'right' : 'left'); xx += cw[i]; }); y += 22; }
    y += 14;
  });
  const n = pages.length; pages.forEach((p, i) => { cv = p; cx = p.getContext('2d'); text('Generated ' + genStamp() + ' by ' + (company.user || ''), M, H - 28, 9, false, '#777'); text('Page ' + (i + 1) + ' of ' + n, W - M, H - 28, 9, false, '#777', 'right'); });
  const doc = new window.jspdf.jsPDF({unit: 'pt', format: 'a4', orientation: 'portrait'}), pw = doc.internal.pageSize.getWidth ? doc.internal.pageSize.getWidth() : 595.28, ph = doc.internal.pageSize.getHeight ? doc.internal.pageSize.getHeight() : 841.89;
  pages.forEach((p, i) => { if (i) doc.addPage(); doc.addImage(p.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, ph); });
  return doc;
}

function backupObject(){ return {app: 'retco-order-collection', version: VERSION, exportedAt: nowIso(), exportedBy: D.settings.user, fileName: 'retco_order_collection_backup_' + today() + '.json', settings: D.settings, shops: D.shops, products: D.products, records: D.records, insights: D.insights, followUps: D.followUps}; }
function validateBackup(o){
  if (!o || typeof o !== 'object') return 'This is not a backup file.'; if (o.app !== 'retco-order-collection') return 'This is not an Order Collection backup (it says "' + (o.app || 'unknown') + '").'; if (!(num(o.version) >= 1)) return 'The backup has no version.'; if (num(o.version) > VERSION) return 'This backup is from a newer version of the app. Update the app first.';
  for (const t of TABLES) if (!Array.isArray(o[t])) return 'The backup is damaged: "' + t + '" is missing.';
  for (const r of o.records) if (!r || !r.id || !validDate(r.date) || RESULTS.indexOf(r.result) < 0) return 'The backup is damaged: a record has a bad date or result.';
  for (const s of o.shops) if (!s || !s.id || !s.name) return 'The backup is damaged: a shop has no name.'; for (const p of o.products) if (!p || !p.id || !p.name) return 'The backup is damaged: a product has no name.'; for (const i of o.insights) if (!i || !i.id || !i.recordId) return 'The backup is damaged: an insight is not linked to a record.'; return '';
}
const backupCounts = o => TABLES.map(t => (o[t] || []).length + ' ' + t).join(', ');
function mergeBackup(o){
  const added = {}, conflicts = []; let skipped = 0;
  TABLES.forEach(t => { added[t] = 0; o[t].forEach(r => {
    if (!r || !r.id) return; if (D[t].some(x => x.id === r.id)){ skipped++; return; }
    if ((t === 'shops' || t === 'products') && D[t].some(x => norm(x.code) === norm(r.code))){ conflicts.push((t === 'shops' ? 'Shop ' : 'Product ') + r.code + ' ' + r.name + ' (that ID is already used on this phone, so it was left out)'); return; }
    D[t].push(r); added[t]++; }); });
  return {added, skipped, conflicts};
}

  try { localStorage.setItem(KEY + '_prev', JSON.stringify(D)); } catch(e){}
  const b = blankDB(); b.settings = Object.assign(b.settings, o.settings || {}); TABLES.forEach(t => { b[t] = o[t]; }); D = b;
}

  integration.appendChild(T('div','note','Required hand-off: create one central order using the canonical Shop/Business Partner ID and Product ID. Sales Register converts the order to an invoice by reference. Do not create duplicate order tables or post stock/money from this app.'));
  integration.appendChild(T('div','note','AI-ready approach: retain original customer/shop wording, structured reason codes, product IDs and timestamps. AI may summarize or classify feedback and suggest follow-ups, but must not approve orders, change prices, post stock or move money automatically.'));
  const aiPrompt = T('button','btn-secondary','Copy AI summary prompt'); aiPrompt.type='button';
  aiPrompt.addEventListener('click', async () => {
    const prompt = 'You are RETCO Business Insights assistant. Analyze the supplied Order Collection records. Preserve original quotes; group feedback by product ID and product name; identify order/no-order reasons, recurring complaints, competitor mentions, demand signals and follow-up actions. Separate facts from hypotheses. Do not invent data, approve orders, change prices, post stock or create financial transactions. Return a concise management summary with evidence and recommended human actions.';
    try { await navigator.clipboard.writeText(prompt); toast('AI prompt copied'); } catch(e) { cloudStatus.textContent='Clipboard unavailable. You can use the AI prompt described in this section manually.'; }
  });
  integration.appendChild(aiPrompt);
  integration.appendChild(T('div','msg','Current migration status: localStorage only → Supabase Auth setup scaffold added → central order table/field mapping, RLS verification, offline outbox and cloud sync still pending.'));
  w.appendChild(integration);

  const dl = D.records.filter(r => r.status === 'deleted').sort((x, y) => (y.deletedAt || '').localeCompare(x.deletedAt || ''));
  const d = T('div', 'card form-stack'); d.id = 'deletedCard'; d.appendChild(T('div', 'section-label', 'Deleted records (' + dl.length + ')')); if (!dl.length) d.appendChild(T('div', 'note', 'No deleted records.'));
  dl.slice(0, 30).forEach(r => { const row = T('div', 'sale-row'); row.setAttribute('data-del', r.id); const tp = T('div', 'sale-row-top'), mn = T('div', 'sale-row-main'); add(mn, T('div', 'shop', shopCode(r) + ' · ' + shopName(r)), T('div', 'prod', fmtDate(r.date) + ' · ' + r.result)); const b = T('button', 'btn-secondary', 'Restore'); b.addEventListener('click', () => { restoreRecord(r); toast('Record restored'); rerender(); }); add(tp, mn, b); row.appendChild(tp); d.appendChild(row); }); w.appendChild(d);
  const wp = T('div', 'card form-stack'); wp.appendChild(T('div', 'section-label', 'Start over')); wp.appendChild(T('div', 'note', 'Deletes every shop, product and record on this phone. Save a backup first.'));
  const bt = armedDelete('Erase all data on this phone', () => { try { localStorage.setItem(KEY + '_prev', JSON.stringify(D)); } catch(e){} const th = D.settings; D = blankDB(); D.settings = th; seedProducts(); save(); shopOpen = null; prodOpen = null; collectF = null; toast('All data erased'); go('home', 'dash'); }); bt.id = 'btnWipe'; wp.appendChild(bt); w.appendChild(wp);
};

/* ================= boot ================= */
loadDB(); applyTheme(D.settings.theme || (function(){ try { return localStorage.getItem('retco_oc_theme') || 'light'; } catch(e){ return 'light'; } })());
$('btnTheme').addEventListener('click', () => { const n = (D.settings.theme === 'dark') ? 'light' : 'dark'; setTheme(n); toast(n === 'dark' ? 'Dark theme' : 'Light theme'); });
go('home', 'dash');
window.__oc = {get D(){ return D; }, saveRecord, saveShop, saveProduct, deleteRecord, restoreRecord, shopStats, recordsFiltered, buildReport, backupObject, validateBackup, mergeBackup, replaceWithBackup, insightsTransfer, openFollowUps, reportPdf, loadDB, go, newCollect: () => newCollect(), setNow: null};
})();
</script>
